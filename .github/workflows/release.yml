name: Publish to Dockerhub

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sbt-git derives the version from tags
      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          java-version: "27"
          distribution: "temurin"
          cache: sbt
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Package and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          sbt --client 'Docker / stage'
          # Ask sbt where it staged the build and which version it built
          sbt_print() { sbt --client "print $1" | perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' | grep -v '^[[:space:]]*$' | tail -1; }
          STAGE_DIR=$(sbt_print 'oni/Docker/stagingDirectory')
          APP_VERSION=$(sbt_print 'oni/version')
          echo "Staged $APP_VERSION in $STAGE_DIR"
          if [[ "$APP_VERSION" != "$IMAGE_TAG" ]]; then
            echo "::error::sbt version ($APP_VERSION) does not match tag ($IMAGE_TAG)"
            exit 1
          fi
          sbt --client shutdown
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
          docker buildx create --name dockerbuilder --platform linux/amd64,linux/arm64 --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t mbari/oni:${IMAGE_TAG} \
            -t mbari/oni:latest \
            --push "$STAGE_DIR"
